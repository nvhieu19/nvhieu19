name: Update Profile Activity

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch: # manual run from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/activity.yml"

permissions:
  contents: write # commit the refreshed SVG cards and Featured Projects block

concurrency:
  group: profile-activity
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch real data and regenerate cards
        env:
          # Optional secret GH_STATS_TOKEN (classic PAT, scope: read:user) also counts private
          # contributions in the totals. Falls back to the built-in token (public data only).
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/update-profile.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update profile activity [skip ci]"
            git push
          fi
